[package]
name = "platen-backend"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]

[dependencies]
color-eyre = "0.6.5"
reqwest = { version = "0.13.4", features = ["json", "cookies", "query"] }
sea-orm = { version = "2.0.1", features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
migration = { path = "migration" }
axum = { version = "0.8.9", features = ["macros"] }
url = "2.5.8"
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
figment = { version = "0.10", features = ["env", "toml"] }
chrono = { version = "0.4.45", features = ["serde"] }
content_disposition = "0.4.0"
tempfile = "3.27.0"
futures-util = "0.3.34"
async-trait = "0.1.92"
nanoid = "0.5.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
