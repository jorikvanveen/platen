[package]
name = "platen-backend"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]

[dependencies]
color-eyre = "0.6.5"
reqwest = { version = "0.13.4", features = ["json"] }
rustypipe = "0.11.4"
sea-orm = { version = "2.0.1", features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls"] }
sea-orm-migration = "2.0.1"
sea-schema = "0.16.0-rc.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
migration = { path = "migration" }
axum = { version = "0.8.9", features = ["macros"] }
axum-macros = { version = "0.5.0-rc.1" }
