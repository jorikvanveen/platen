[package]
name = "platen-backend"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]

[dependencies]
color-eyre = "0.6.5"
reqwest = { version = "0.13.4", features = ["json", "cookies"] }
rustypipe = "0.11.4"
sea-orm = { version = "2.0.1", features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls"] }
sea-orm-migration = "2.0.1"
sea-schema = "0.16.0-rc.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
migration = { path = "migration" }
axum = { version = "0.8.9", features = ["macros"] }
axum-macros = { version = "0.5.0-rc.1" }
url = "2.5.8"
urlencoding = "2.1.3"
ts-rs = "12.0.1"
figment = { version = "0.10", features = ["env", "toml"] }
chrono = "0.4.45"
base64 = "0.23.1"
dirs = "6.0.0"
content_disposition = "0.4.0"
tempfile = "3.27.0"
futures-util = "0.3.34"
async-trait = "0.1.91"
nanoid = "0.4.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
